<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avcı Drone — Yer Kontrol İstasyonu</title>
<!--
  ================================================================================
  SADE ARAYÜZ (2026-08-25, kullanıcı isteği)
  ================================================================================
  "arayüzü sadeleştir, boş kullanılmayan butonların hepsini çıkart, köklü bir
   değişiklik yap... görev başlat / hibrit / gps / görsel butonları olsun,
   çok öyle başka bir şey olmasın"

  ÇIKARILANLAR — hepsi BİZDE KARŞILIĞI OLMAYAN, ekranda "—" gösteren şeylerdi:
    * "Görev Başlat (İnovasyonlu J)" / "Gerçek GPS (test)"  -> onların GNSS
      filtre kıyas sistemi; bizde J filtresi yok
    * "BOZUK GNSS GİRDİSİ" kartı (bozulma/paket yaşı/J düzeltme)  -> aynı sebep
    * "Manuel Mod" (klavyeyle RC)  -> bizde yok
    * "Tune (Canlı Ayar)" kaydırıcıları  -> panel tasarım kararı: ayarları
      yapay zekâ değiştirir, uçuş sırasında slider yok
    * "Kayıtlar / galeri", LOS grafiği, minimap, olay günlüğü, PnP poz kartı
    * TAKİP düğmesi  -> ölçüldü ve KAPALI kaldı (kontrol döngüsünden %16
      alıyor, kazanç gürültü içinde); env ile açılabilir

  TAM SÜRÜM `dow/web/index_tam.html`'de duruyor (kıyas/geri dönüş için).

  ⭐ KUTU FPV AKIŞINA SUNUCUDA ÇİZİLİYOR (dow/panel.py::kare_koy):
     yeşil düz = gerçek tespit · turuncu kesik = takipçi öngörüsü.
     Bu yüzden istemci tarafında ayrı overlay YOK — aynı kutuyu iki kez
     çizmek hem gereksiz hem de kayma riski.
  ================================================================================
-->
<style>
  :root{
    --bg:#0a0e14; --panel:#11161f; --panel2:#161c27; --border:#222c3a;
    --text:#cdd6e4; --muted:#6b7891; --accent:#00e0a4; --accent2:#33a0ff;
    --danger:#ff5d5d; --warn:#ffb454;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);
    color:var(--text);height:100vh;display:grid;
    grid-template-rows:52px 64px 1fr;overflow:hidden;
  }
  .mono{font-family:Consolas,"Courier New",monospace}

  /* --- üst şerit --- */
  header{
    display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--border);
  }
  header h1{font-size:15px;font-weight:600;letter-spacing:.4px}
  header h1 span{color:var(--accent)}
  .bag{margin-left:auto;display:flex;align-items:center;gap:7px;
       font-size:12px;color:var(--muted)}
  .nokta{width:9px;height:9px;border-radius:50%;background:var(--danger)}
  .nokta.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}

  /* --- kilit bandı --- */
  #kilitBar{
    display:flex;align-items:center;gap:16px;padding:0 18px;
    background:var(--panel2);border-bottom:1px solid var(--border);
    transition:background .25s;
  }
  #kilitBar.on{background:#0d2a20;border-bottom-color:#1d6b52}
  #kilitIkon{font-size:22px}
  #kilitMetin{font-size:17px;font-weight:700;letter-spacing:.5px}
  #kilitBar.on #kilitMetin{color:var(--accent)}
  .pbar{flex:1;height:9px;background:#0a0e14;border-radius:5px;overflow:hidden;
        border:1px solid var(--border);max-width:420px}
  .pfill{height:100%;width:0;background:var(--accent);transition:width .2s}
  .kSay{font-size:13px;color:var(--muted)}
  .kSay b{color:var(--text);font-family:Consolas,monospace;font-size:15px}

  /* --- gövde --- */
  main{display:grid;grid-template-columns:220px 1fr 250px;min-height:0}
  aside,.sag{background:var(--panel);padding:14px;overflow-y:auto}
  aside{border-right:1px solid var(--border)}
  .sag{border-left:1px solid var(--border)}
  .baslik{font-size:10px;letter-spacing:1.4px;color:var(--muted);
          text-transform:uppercase;margin-bottom:10px}

  /* --- düğmeler --- */
  .btn{
    width:100%;padding:13px 14px;margin-bottom:9px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);
    font-size:14px;font-weight:600;cursor:pointer;text-align:left;
    transition:.15s;display:flex;align-items:center;gap:9px;
  }
  .btn:hover{border-color:#3d4a5c;background:#1b2230}
  .btn.basla{background:#0d4f3c;border-color:#17a97c;color:#eafff7;
             font-size:15px;padding:16px 14px;margin-bottom:16px}
  .btn.basla:hover{background:#12674e}
  .btn.basla:disabled{background:#1a2029;border-color:var(--border);
                      color:var(--muted);cursor:default}
  .kip{display:flex;flex-direction:column;gap:7px}
  .kip button{
    padding:11px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);font-size:13px;
    font-weight:600;cursor:pointer;transition:.15s;
  }
  .kip button:hover{border-color:#3d4a5c;color:var(--text)}
  .kip button.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
  .kip button.on.g{background:#15803d;border-color:#22c55e}
  .kip button.on.v{background:#b45309;border-color:#f59e0b}

  /* --- kamera --- */
  .kam{display:flex;align-items:center;justify-content:center;
       background:#05070a;min-height:0;min-width:0;position:relative;padding:8px}
  /* Görüntü alanı DOLDURUR: en-boy oranı korunur (object-fit:contain),
     kutu koordinatları sunucuda çizildiği için ölçekleme kutuyu kaydırmaz. */
  .kam img{width:100%;height:100%;object-fit:contain;border-radius:6px}
  .kam .bos{color:var(--muted);font-size:14px;text-align:center;line-height:1.8}
  .kam .bos b{color:var(--text);display:block;font-size:16px;margin-bottom:6px}

  /* --- telemetri --- */
  .satir{display:flex;justify-content:space-between;align-items:center;
         padding:6px 0;border-bottom:1px solid #1a2028;font-size:12px}
  .satir:last-child{border-bottom:0}
  .satir i{color:var(--muted);font-style:normal}
  .satir b{font-family:Consolas,monospace;font-size:13px;font-weight:600}
  .rozet{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;
         letter-spacing:.5px}
  .rozet.ok{background:#0d3d2c;color:var(--accent)}
  .rozet.no{background:#3a1f1f;color:var(--danger)}
  .rozet.gs{background:#4a2f0a;color:var(--warn)}
  .fps{display:flex;gap:12px;margin-top:14px;padding-top:12px;
       border-top:1px solid var(--border)}
  .fps div{flex:1;text-align:center}
  .fps b{display:block;font-family:Consolas,monospace;font-size:16px;
         color:var(--accent2)}
  .fps span{font-size:9px;color:var(--muted);letter-spacing:.6px}
  .durumYazi{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>

<header>
  <h1>🛩️ AVCI DRONE — <span>YER KONTROL İSTASYONU</span></h1>
  <div class="bag"><span class="nokta" id="bagNokta"></span>
    <span id="bagYazi">bağlantı yok</span></div>
</header>

<div id="kilitBar">
  <span id="kilitIkon">⛔</span>
  <span id="kilitMetin">KİLİT YOK</span>
  <div class="pbar"><div class="pfill" id="kilitFill"></div></div>
  <span class="kSay"><b id="kilitSure">0.0</b> / 5.0 s</span>
  <span class="kSay" id="kilitDetay">boyut — · merkez —</span>
</div>

<main>
  <aside>
    <div class="baslik">Görev</div>
    <button id="baslaBtn" class="btn basla" onclick="gorevBaslat()">🚀 Görev Başlat</button>

    <div class="baslik">Güdüm Kipi</div>
    <div class="kip">
      <button id="k_hibrit" onclick="kip('hibrit')">HİBRİT</button>
      <button id="k_gps"    onclick="kip('gps')">GPS</button>
      <button id="k_gorsel" onclick="kip('gorsel')">GÖRSEL</button>
    </div>
    <!-- ⚠ CLAUDE.md §6: sinanan ozelligin panelde ac/kapa dugmesi ZORUNLU.
         §0.1: panelde AYNI ANDA TEK yeni ozellik durur. Karar verilince
         (girsin ya da elensin) bu blok SILINIR. -->
    <div class="baslik">Devir Kapısı</div>
    <button id="devirBtn" class="btn" onclick="devirDegis()">📷 KAMERA (10/20)</button>
    <div class="durumYazi" id="solDurum">Hazır.</div>
  </aside>

  <div class="kam">
    <img id="kam" alt="" style="display:none">
    <div class="bos" id="kamBos"><b>Görüntü bekleniyor</b>
      Uçuş süreci başlayınca akış otomatik gelir.</div>
  </div>

  <div class="sag">
    <div class="baslik">Durum</div>
    <div id="telem"></div>
    <div class="fps">
      <div><b id="f1">—</b><span>YAKALAMA</span></div>
      <div><b id="f2">—</b><span>DEDEKTÖR</span></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

// ---- kamera: sunucunun MJPEG akışı (kutu SUNUCUDA çizili) ----
const kam = $("kam"), kamBos = $("kamBos");
function kamBagla(){
  kam.onload = () => { kam.style.display = "block"; kamBos.style.display = "none"; };
  kam.onerror = () => { kam.style.display = "none"; kamBos.style.display = "block"; };
  kam.src = "/video?t=" + Date.now();
}
kamBagla();

// ---- güdüm kipi ----
async function kip(k){
  try{
    await fetch("/api/command", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({cmd:"vismode", mode:{hibrit:"OTO",gps:"GPS",gorsel:"GORSEL"}[k]})});
    kipGoster(k);
  }catch(e){}
}
function kipGoster(k){
  for(const [ad,snf] of [["hibrit",""],["gps","g"],["gorsel","v"]]){
    const b = $("k_"+ad);
    if(b) b.className = (ad===k) ? ("on "+snf) : "";
  }
}

// ---- devir kapısı (CLAUDE.md §6 canlı aç/kapa) ----
//   KAMERA : 10 ardışık tespit -> GORSEL, 20 ardışık tespitsiz -> GPS
//   İSTASYON: drone istasyona oturunca devret (GPS okur, YARIŞMADA YASAK)
async function devirDegis(){
  try{
    const r = await (await fetch("/api/command",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({cmd:"devir"})})).json();
    devirGoster(r.istasyon);
    $("solDurum").textContent = r.msg || "";
  }catch(e){}
}
function devirGoster(ist){
  const b = $("devirBtn"); if(!b) return;
  b.textContent = ist ? "📍 İSTASYON (GPS)" : "📷 KAMERA (10/20)";
  b.className = ist ? "btn on g" : "btn";
}

// ---- görev başlat ----
async function gorevBaslat(){
  $("baslaBtn").disabled = true;
  $("solDurum").textContent = "Görev başlatılıyor…";
  try{
    const r = await (await fetch("/api/command",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({cmd:"basla"})})).json();
    $("solDurum").textContent = r.msg || "Görev başladı.";
    if(!r.ok) $("baslaBtn").disabled = false;
  }catch(e){
    $("solDurum").textContent = "Sunucuya ulaşılamadı.";
    $("baslaBtn").disabled = false;
  }
}

// ---- telemetri ----
const ALANLAR = [
  ["faz",        t => t.gorsel && t.gorsel.durum],
  ["hedef menzil", t => t.distance_m!=null ? t.distance_m.toFixed(1)+" m" : null],
  ["kutu",       t => t.gorsel && t.gorsel.tespit
                     ? (t.gorsel.tespit.w*1920).toFixed(0)+" px" : null],
  ["güven",      t => t.gorsel && t.gorsel.tespit
                     ? t.gorsel.tespit.conf.toFixed(2) : null],
  ["kutu kaynağı", t => t.takip && t.takip.kaynak
                     ? (t.takip.kaynak==="tahmin" ? "öngörü" : "ölçüm") : null],
  ["hız",        t => t.drone ? t.drone.speed_ms.toFixed(1)+" m/s" : null],
  ["irtifa",     t => t.drone ? t.drone.altitude_m.toFixed(0)+" m" : null],
  ["çıkarım",    t => t.gorsel && t.gorsel.perf
                     ? t.gorsel.perf.det_ms.toFixed(0)+" ms" : null],
];

async function tik(){
  try{
    const t = await (await fetch("/api/telemetry")).json();
    const bagli = !!(t.gorsel && t.gorsel.durum && t.gorsel.durum !== "-");
    $("bagNokta").className = "nokta" + (bagli ? " on" : "");
    $("bagYazi").textContent = bagli ? "uçuş sürüyor" : "beklemede";
    if(bagli) $("baslaBtn").disabled = true;

    let h = "";
    for(const [ad, fn] of ALANLAR){
      let v = null; try{ v = fn(t); }catch(e){}
      h += `<div class="satır satir"><i>${ad}</i><b>${v==null?"—":v}</b></div>`;
    }
    $("telem").innerHTML = h;

    const kl = (t.gorsel && t.gorsel.kilit) || {};
    const sure = kl.sure || 0, gerek = kl.gerek || 5;
    $("kilitSure").textContent = sure.toFixed(1);
    $("kilitFill").style.width = Math.min(100, 100*sure/gerek) + "%";
    const tam = sure >= gerek;
    $("kilitBar").className = tam ? "on" : "";
    $("kilitIkon").textContent = tam ? "✅" : (kl.anlik ? "🔓" : "⛔");
    $("kilitMetin").textContent = tam ? "ATIŞA HAZIR"
                                      : (kl.anlik ? "KİLİTLENİYOR" : "KİLİT YOK");
    $("kilitDetay").textContent =
      "boyut " + (kl.kaplama_pct!=null ? kl.kaplama_pct.toFixed(1)+"%" : "—")
      + " / 6% · merkez " + (kl.av ? "içinde ✓" : "dışında ✗");

    const p = (t.gorsel && t.gorsel.perf) || {};
    $("f1").textContent = (p.yakala_fps||0).toFixed(1);
    $("f2").textContent = (p.fps||0).toFixed(1);
    if(t.kip) kipGoster(t.kip);
  }catch(e){
    $("bagNokta").className = "nokta";
    $("bagYazi").textContent = "sunucu kapalı";
  }
}
setInterval(tik, 400); tik();
</script>
</body>
</html>
